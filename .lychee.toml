# Lychee link-checker configuration.
# Docs: https://github.com/lycheeverse/lychee/blob/master/lychee.example.toml
#
# Root-relative links (e.g. /_astro/..., /sitemap-index.xml) in the
# generated HTML are resolved against --root-dir, which the CI workflow
# sets to the generated site root (dist/ or dist/client/).

# Skip links matching these regex patterns when the target is known to be
# unreliable or unsuitable for anonymous automated requests.
exclude = [
  # The new Brand Kit canonical URL is not live until this PR merges.
  # Its root-relative route and assets are checked against the build output.
  '^https://opensource\.iflytek\.com/brand$',
  # Twitter / X requires auth for most content.
  '^https?://(www\.)?(twitter|x)\.com/',
  # LinkedIn rate-limits aggressively.
  '^https?://(www\.)?linkedin\.com/',
  # GitHub / GitLab pagination traps.
  'github\.com/.*/page/\d+',
  # npm registry returns 403 for private / renamed / non-existent scoped
  # packages, even to unauthenticated requests. Blog posts reference
  # internal packages that aren't publicly listed on npmjs.com.
  '^https?://(www\.)?npmjs\.com/package/',
  # Discord invite URLs are notoriously flaky: rate-limits, 404s on
  # deleted/expired invites, and frequent timeouts. These links are
  # present in site footers and blog posts but are unreliable targets
  # for an automated link checker.
  '^https?://(www\.)?discord\.(gg|com)/',
  # Hugging Face profile / org pages frequently time out from CI
  # runners (especially on first request). Exclude to avoid spurious
  # failures for a known-stable target.
  '^https?://(www\.)?huggingface\.co/',
]

# Retry flaky requests a couple of times before reporting them.
max_retries = 3
retry_wait_time = 2

# Additional HTTP status codes treated as successful responses (on top
# of lychee's defaults 200/204/206/301/302/307/308).
# 429 = Too Many Requests (transient rate-limit); 999 = LinkedIn rate-limit.
accept = [200, 204, 206, 301, 302, 307, 308, 429, 999]
